<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ورود | مرکز عملیات محتوای TelTest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app-stage06.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark"><i class="fa-solid fa-bolt" aria-hidden="true"></i></div>
    <h1>TelTest</h1>
    <p class="muted">مرکز یکپارچه استخراج، نگهداری و انتقال محتوا</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>نام کاربری</label>
      <input name="username" type="text" required autofocus autocomplete="username">

      <label>رمز عبور</label>
      <input name="password" type="password" required autocomplete="current-password">

      <button class="btn primary full" type="submit">ورود به پنل</button>
    </form>

    <div class="version">v{{ version }} · Stage 07</div>
  </main>
</body>
</html>
